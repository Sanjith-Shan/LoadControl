name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: rapid, more checks
        run: go test -count=1 -rapid.checks=1000 ./limit ./retry ./throttle ./priority .
      - run: go build ./cmd/...
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: apply the benchmark patch and build every service
        run: |
          git clone -q https://github.com/delimitrou/DeathStarBench.git /tmp/dsb
          git -C /tmp/dsb checkout -q 6ecb09706140f8730b5385c08f1386c654c3c526
          bash bench/hotel/apply_patch.sh /tmp/dsb "$PWD" /tmp/hotel
          cd /tmp/hotel && GOFLAGS=-mod=mod go mod tidy && go mod vendor && go build -mod=vendor ./...
